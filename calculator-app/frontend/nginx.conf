server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React app. try_files falls back to index.html for any path
    # that isn't a real file, so client-side routing (e.g. a router
    # handling /some/deep/link) still works on a hard refresh instead of
    # Nginx returning a 404 for a path it doesn't have a file for.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend container. "backend" is resolved by
    # Docker Compose's built-in DNS to that service's container - see
    # docker-compose.yml. Omitting a path on proxy_pass means Nginx forwards
    # the original request URI unchanged, e.g. /api/calculate stays
    # /api/calculate on the way to the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://backend:8080;
    }
}
