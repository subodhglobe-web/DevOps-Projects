apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: react-frontend
        # Replace with your actual Docker Hub or AWS ECR image URI
        image: subodh009/calculator-frontend:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        env:
        # If your React app needs to know where the backend API is at build/runtime
        - name: REACT_APP_API_URL
          value: "http://backend-service:8080"
