apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: subodh009/notes-backend:latest
          ports:
            - containerPort: 5000
