server {
    listen 80;
    server_name localhost;

    # 1. SERVE REACT FRONTEND STATIC FILES
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Crucial for React Router: redirects all page refreshes back to index.html
        try_files $uri $uri/ /index.html; 
    }

    # 2. REVERSE PROXY FOR THE BACKEND API
    location /api/ {
        # 'backend' must match your Docker container or Compose service name
        proxy_pass http://backend:5000/; 
        
        # Standard HTTP/1.1 configuration headers for proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts to handle longer database requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

